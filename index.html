<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEBSITE AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video id="backgroundVideo" class="background-video" autoplay loop playsinline preload="auto" aria-hidden="true">
    <source src="background.mp4" type="video/mp4" />
  </video>
  <div class="background-overlay" aria-hidden="true"></div>

  <main class="container">
    <header class="profile">
      <img src="profile.jpg" alt="Foto profil Kyhan" />
      <h1>WEBSITE AI</h1>
      <p>Temukan AI terbaik di sini ✨</p>
    </header>

    <nav class="links" aria-label="Daftar layanan AI">
      <a href="https://app.roboflow.com/" target="_blank" rel="noopener noreferrer">
        <span class="link-content"><i class="fa-solid fa-eye" aria-hidden="true"></i><span>Roboflow</span></span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">
        <span class="link-content"><i class="fa-solid fa-robot" aria-hidden="true"></i><span>ChatGPT</span></span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">
        <span class="link-content"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span>Google Gemini</span></span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://chat.qwen.ai/" target="_blank" rel="noopener noreferrer">
        <span class="link-content"><i class="fa-solid fa-brain" aria-hidden="true"></i><span>Qwen AI</span></span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://chatgpt.com/c/6aeecef1-7300-83ec-b000-eae06c9e833b" target="_blank" rel="noopener noreferrer">
        <span class="link-content"><i class="fa-solid fa-comments" aria-hidden="true"></i><span>ChatGPT Chat</span></span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://www.dola.com/" target="_blank" rel="noopener noreferrer">
        <span class="link-content"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i><span>Dola AI</span></span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <button id="soundButton" class="sound-button" type="button" hidden>
      <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
      Nyalakan Suara Video
    </button>

    <footer class="footer"><p>Website AI terbaik 💜</p></footer>
  </main>

  <script>
    const video = document.getElementById("backgroundVideo");
    const soundButton = document.getElementById("soundButton");

    async function startVideo() {
      try {
        video.muted = false;
        await video.play();
        soundButton.hidden = true;
      } catch (error) {
        video.muted = true;
        soundButton.hidden = false;
        try {
          await video.play();
        } catch (mutedError) {
          soundButton.innerHTML =
            '<i class="fa-solid fa-play" aria-hidden="true"></i> Putar Video & Suara';
        }
      }
    }

    soundButton.addEventListener("click", async () => {
      try {
        video.muted = false;
        await video.play();
        soundButton.hidden = true;
      } catch (error) {
        video.muted = true;
        soundButton.hidden = false;
      }
    });

    startVideo();
  </script>
</body>
</html>
